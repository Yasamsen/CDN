<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050308">
<title>Yasam Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box}html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:#050308;color:#fce4ec;font-family:"Zen Maru Gothic",sans-serif;overflow-x:hidden;
background-image:radial-gradient(ellipse at 20% 0%,rgba(168,85,247,.12) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(236,72,153,.10) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(34,211,238,.06) 0%,transparent 70%);background-attachment:fixed}
button{font:inherit;color:inherit}.scrollbar-hide{scrollbar-width:none;-ms-overflow-style:none}.scrollbar-hide::-webkit-scrollbar{display:none}
.app{min-height:100vh;display:flex;position:relative}.petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal-wrap{position:absolute;top:0;animation:sakuraFall linear infinite}.petal{width:9px;height:9px;background:linear-gradient(135deg,#f48fb1,#ec407a);border-radius:50% 0 50% 50%;opacity:.3;transform:rotate(45deg)}
.sidebar{width:270px;flex-shrink:0;background:rgba(10,6,18,.8);backdrop-filter:blur(20px);border-right:1px solid rgba(236,72,153,.1);padding:28px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:20}
.brand{margin-bottom:32px}.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:10px;text-transform:uppercase;letter-spacing:.25em;color:rgba(168,85,247,.7);font-weight:500}.brand h1{font-size:30px;font-weight:900;line-height:1;margin:0;letter-spacing:-.04em}.brand p{color:rgba(248,187,208,.4);font-size:12px;margin:8px 0 0;letter-spacing:.04em}
.icon-pink{color:#f48fb1}.gradient-text{background:linear-gradient(135deg,#f48fb1 0%,#a855f7 50%,#22d3ee 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 6s ease infinite}
.divider{height:1px;background:linear-gradient(to right,rgba(236,72,153,.3),rgba(168,85,247,.2),transparent);margin-bottom:24px}
.folder-list{display:flex;flex-direction:column;gap:6px}.folder-btn{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;font-size:14px;border:1px solid transparent;background:transparent;color:rgba(248,187,208,.5);cursor:pointer;text-align:left;transition:.35s}.folder-btn:hover{background:rgba(26,16,48,.6);color:#fce4ec;border-color:rgba(236,72,153,.2)}.folder-btn.active{background:linear-gradient(90deg,rgba(236,72,153,.15),rgba(168,85,247,.1));color:white;border-color:rgba(236,72,153,.4);box-shadow:0 0 0 1px rgba(236,72,153,.15),0 0 20px rgba(236,72,153,.1),inset 0 0 20px rgba(168,85,247,.05)}.folder-btn span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:capitalize}.connected{margin-top:40px;padding-top:24px;border-top:1px solid rgba(236,72,153,.1);font:12px Inter,sans-serif;color:rgba(248,187,208,.3);display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:#22d3ee;box-shadow:0 0 12px #22d3ee;animation:glowPulse 3s infinite}
.mobilebar{display:none}.content{flex:1;min-width:0;position:relative;z-index:10}.main{padding:40px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;gap:12px;flex-wrap:wrap}.heading-left{display:flex;align-items:center;gap:12px}.heading h2{font-size:clamp(24px,3vw,36px);margin:0;font-weight:900;line-height:1;text-transform:capitalize}.count{font:14px Inter,sans-serif;color:rgba(248,187,208,.5);letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}.card{position:relative;background:rgba(17,10,31,.6);border:1px solid rgba(236,72,153,.1);border-radius:16px;overflow:hidden;cursor:pointer;transition:.7s;animation:scaleIn .85s cubic-bezier(.16,1,.3,1) forwards;opacity:0}.card:hover{transform:translateY(-8px);border-color:rgba(236,72,153,.4);box-shadow:0 0 30px rgba(236,72,153,.18),0 0 60px rgba(168,85,247,.08)}.thumb{position:relative;width:100%;aspect-ratio:4/5;background:#1a1030;overflow:hidden}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;transition:1.5s}.card:hover .thumb img,.card:hover .thumb video{transform:scale(1.1)}.card-gradient{position:absolute;inset:0;background:linear-gradient(to top,rgba(5,3,8,.6),transparent 60%);opacity:0;transition:.7s}.card:hover .card-gradient{opacity:1}.download-btn{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(5,3,8,.6);backdrop-filter:blur(12px);border:1px solid rgba(236,72,153,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:.5s;z-index:3}.card:hover .download-btn{opacity:1}.download-btn:hover{background:#ec407a;color:white;transform:scale(1.1)}.play{position:absolute;bottom:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(5,3,8,.7);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;border:1px solid rgba(236,72,153,.2)}.play svg{fill:currentColor;margin-left:2px}.error,.empty{text-align:center;padding:80px 20px;color:rgba(248,187,208,.4);font:14px Inter,sans-serif}.error{color:#f48fb1}.shimmer{background:linear-gradient(100deg,#110a1f 30%,#1a1030 50%,#110a1f 70%);background-size:200% 100%;animation:shimmer 2s ease-in-out infinite;border-radius:16px}.skeleton{aspect-ratio:4/5}.mobile-nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}.mobile-nav .folder-btn{width:auto;flex-shrink:0;padding:8px 14px;background:rgba(26,16,48,.6);border-radius:12px}.mobile-nav .folder-btn.active{background:linear-gradient(90deg,rgba(236,72,153,.15),rgba(168,85,247,.1))}
.lightbox{position:fixed;inset:0;background:rgba(5,3,8,.95);backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .25s}.lightbox-bg{position:absolute;inset:0;background:linear-gradient(135deg,rgba(168,85,247,.05),transparent,rgba(236,72,153,.05));pointer-events:none}.lightbox-media{position:relative;max-width:88vw;max-height:88vh;z-index:2;animation:slideRight .4s}.lightbox-media img,.lightbox-media video{display:block;max-width:88vw;max-height:88vh;border-radius:16px;object-fit:contain;box-shadow:0 0 30px rgba(236,72,153,.25),0 0 60px rgba(168,85,247,.15)}.lb-btn{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(236,72,153,.1);border:1px solid rgba(236,72,153,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;transition:.4s}.lb-btn:hover{background:rgba(236,72,153,.3);transform:scale(1.1)}.close{top:24px;right:24px}.prev{left:24px;top:50%;transform:translateY(-50%)}.next{right:24px;top:50%;transform:translateY(-50%)}.prev:hover,.next:hover{transform:translateY(-50%) scale(1.1)}.lb-download{right:24px;bottom:24px}.counter{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);color:rgba(248,187,208,.6);font:14px Inter,sans-serif;letter-spacing:.08em;z-index:5}.spinner{animation:spin 1s linear infinite}.loading-box{width:60vw;height:60vh;display:flex;align-items:center;justify-content:center}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}@keyframes slideRight{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)}}@keyframes glowPulse{0%,100%{opacity:.5}50%{opacity:1}}@keyframes gradientShift{0%,100%{background-position:0 center}50%{background-position:100% center}}@keyframes sakuraFall{0%{transform:translateY(-10vh) translateX(0) rotate(0);opacity:0}10%{opacity:.8}90%{opacity:.8}100%{transform:translateY(110vh) translateX(100px) rotate(360deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1200px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:900px){.sidebar{display:none}.mobilebar{display:block;background:rgba(10,6,18,.8);backdrop-filter:blur(20px);border-bottom:1px solid rgba(236,72,153,.1);padding:20px 20px 0;position:sticky;top:0;z-index:30}.mobilebar .brand{margin-bottom:16px}.mobilebar .brand h1{font-size:21px}.mobilebar .eyebrow{font-size:9px;letter-spacing:.2em}.main{padding:24px 20px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media(max-width:600px){.main{padding:20px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.heading{margin-bottom:20px}.heading h2{font-size:25px}.count{font-size:12px}.download-btn{opacity:1;width:34px;height:34px}.lb-btn{width:42px;height:42px}.prev{left:10px}.next{right:10px}.close{top:12px;right:12px}.lb-download{right:12px;bottom:12px}.counter{bottom:20px}.lightbox-media{max-width:94vw}.lightbox-media img,.lightbox-media video{max-width:94vw;max-height:82vh}.loading-box{width:80vw;height:60vh}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const USER='Yasamsen', REPO='media-repo', BRANCH='main';
const API_BASE=`https://api.github.com/repos/${USER}/${REPO}/contents/`;
const RAW_BASE=`https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/`;
const $=s=>document.querySelector(s);
const icon=(name,size=16)=>`<i data-lucide="${name}" width="${size}" height="${size}"></i>`;
let folders=[],activeFolder=null,media=[],lightboxIndex=null,blobCache=new Map();

function isImage(url){return /\.(jpe?g|png|webp|gif|avif|bmp|svg)$/i.test(url)}
function isVideo(url){return /\.(mp4|webm|mov|mkv|avi|m4v)$/i.test(url)}
async function getBlob(url){if(blobCache.has(url))return blobCache.get(url);const r=await fetch(url);if(!r.ok)throw Error();const b=await r.blob(),u=URL.createObjectURL(b);blobCache.set(url,u);return u}
async function downloadMedia(url){const u=await getBlob(url),a=document.createElement('a');a.href=u;a.download=url.split('/').pop()||'file';document.body.appendChild(a);a.click();a.remove()}

function petals(){return Array.from({length:15},(_,i)=>{const l=Math.random()*100,d=Math.random()*12,t=10+Math.random()*8,s=6+Math.random()*10;return `<div class="petal-wrap" style="left:${l}%;animation-delay:${d}s;animation-duration:${t}s"><div class="petal" style="width:${s}px;height:${s}px"></div></div>`}).join('')}

function folderButtons(mobile=false){
 if(!folders.length)return `<div class="empty" style="padding:20px">Tidak ada folder</div>`;
 return folders.map(f=>`<button class="folder-btn ${f===activeFolder?'active':''}" data-folder="${encodeURIComponent(f)}">${icon('folder',mobile?14:16)}<span>${escapeHtml(f)}</span>${!mobile&&f===activeFolder?icon('chevron-right',15):''}</button>`).join('')
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function shell(){
 document.body.innerHTML=`<div class="app"><div class="petals">${petals()}</div>
 <aside class="sidebar"><div class="brand"><div class="eyebrow">${icon('sparkles',18)}<span>Media Collection</span></div><h1><span class="gradient-text">Yasam</span><span> Gallery</span></h1><p>コレクション • Private anime media</p></div><div class="divider"></div><nav class="folder-list" id="desktopFolders"><div class="empty" style="padding:10px">Memuat...</div></nav><div class="connected"><span class="dot"></span><span>Connected to repo</span></div></aside>
 <div class="content"><div class="mobilebar"><div class="brand"><div class="eyebrow">${icon('sparkles',14)}<span>Media Collection</span></div><h1><span class="gradient-text">Yasam</span><span> Gallery</span></h1></div><nav class="mobile-nav scrollbar-hide" id="mobileFolders"><div class="shimmer" style="height:36px;width:96px;flex-shrink:0"></div><div class="shimmer" style="height:36px;width:96px;flex-shrink:0"></div></nav></div>
 <main class="main"><div class="heading"><div class="heading-left"><h2 id="title" class="gradient-text">Gallery</h2>${icon('sparkles',20)}</div><span id="count" class="count"></span></div><div id="gallery"></div></main></div></div>`;
 lucide.createIcons();loadFolders();
}
function renderFolders(){ $('#desktopFolders').innerHTML=folderButtons(false);$('#mobileFolders').innerHTML=folderButtons(true);lucide.createIcons();
 document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{activeFolder=decodeURIComponent(b.dataset.folder);renderFolders();loadMedia(activeFolder)});
}
async function loadFolders(){try{const r=await fetch(API_BASE);if(!r.ok)throw Error();const data=await r.json();folders=data.filter(x=>x.type==='dir').map(x=>x.name);if(folders.length){activeFolder=folders[0];renderFolders();loadMedia(activeFolder)}else{renderFolders();renderGalleryMessage('Folder kosong.')}}catch(e){document.querySelectorAll('#desktopFolders,#mobileFolders').forEach(x=>x.innerHTML='<div class="error">Gagal memuat folder</div>')}}
async function loadMedia(folder){$('#title').textContent=folder;$('#count').textContent='';$('#gallery').innerHTML='<div class="grid">'+Array.from({length:10},()=>'<div class="shimmer skeleton"></div>').join('')+'</div>';
 try{const r=await fetch(RAW_BASE+encodeURIComponent(folder)+'/api.json');if(!r.ok)throw Error();const json=await r.json();media=(json.data||[]);$('#count').textContent=media.length?media.length+' item':'';renderGallery()}catch(e){media=[];renderGalleryMessage('Gagal memuat folder ini.','error')}}
function renderGalleryMessage(msg,cls=''){ $('#gallery').innerHTML=`<div class="${cls==='error'?'error':'empty'}">${msg}</div>`}
function renderGallery(){if(!media.length){renderGalleryMessage('Folder ini kosong.');return}$('#gallery').innerHTML='<div class="grid">'+media.map((url,i)=>{const type=isVideo(url)?'video':isImage(url)?'image':'other';return `<div class="card" style="animation-delay:${i*.09}s" data-index="${i}"><div class="thumb"><div class="shimmer" style="position:absolute;inset:0"></div>${type==='image'?`<img src="${escapeHtml(url)}" loading="lazy" onload="this.previousElementSibling.style.display='none'" onerror="this.style.display='none';this.previousElementSibling.style.display='none'">`:type==='video'?`<video src="${escapeHtml(url)}" muted preload="metadata" onloadeddata="this.previousElementSibling.style.display='none'"></video><div class="play">${icon('play',14)}</div>`:`<div class="empty" style="padding:0;position:absolute;inset:0;display:flex;align-items:center;justify-content:center">File tidak didukung</div>`}<div class="card-gradient"></div></div><button class="download-btn" title="Download" data-download="${i}">${icon('download',15)}</button></div>`}).join('')+'</div>';
 lucide.createIcons();
 document.querySelectorAll('.card').forEach(c=>c.onclick=e=>{if(!e.target.closest('[data-download]'))openLightbox(+c.dataset.index)});
 document.querySelectorAll('[data-download]').forEach(b=>b.onclick=async e=>{e.stopPropagation();b.innerHTML=icon('loader-circle',15);lucide.createIcons();try{await downloadMedia(media[+b.dataset.download])}catch{}b.innerHTML=icon('download',15);lucide.createIcons()});
}
function openLightbox(i){lightboxIndex=i;renderLightbox()}
function renderLightbox(){const url=media[lightboxIndex],type=isVideo(url)?'video':isImage(url)?'image':'other';document.body.insertAdjacentHTML('beforeend',`<div class="lightbox" id="lightbox"><div class="lightbox-bg"></div><button class="lb-btn close" id="lbClose">${icon('x',20)}</button><button class="lb-btn prev" id="lbPrev">${icon('chevron-left',24)}</button><div class="lightbox-media" id="lbMedia"><div class="shimmer loading-box">${icon('loader-circle',36)}</div></div><button class="lb-btn next" id="lbNext">${icon('chevron-right',24)}</button><button class="lb-btn lb-download" id="lbDownload">${icon('download',18)}</button><div class="counter">${lightboxIndex+1} <span style="color:rgba(236,72,153,.4)">/</span> ${media.length}</div></div>`);lucide.createIcons();const box=$('#lbMedia');getBlob(url).then(u=>{box.innerHTML=type==='image'?`<img src="${u}" oncontextmenu="return false">`:type==='video'?`<video src="${u}" controls autoplay oncontextmenu="return false"></video>`:'<div class="empty">File tidak didukung</div>'}).catch(()=>box.innerHTML='<div class="error">Gagal memuat media</div>');
 $('#lbClose').onclick=closeLightbox;$('#lbPrev').onclick=()=>nav(-1);$('#lbNext').onclick=()=>nav(1);$('#lbDownload').onclick=async()=>{try{await downloadMedia(url)}catch{}};
 $('#lightbox').onclick=e=>{if(e.target.id==='lightbox')closeLightbox()}
}
function closeLightbox(){const x=$('#lightbox');if(x)x.remove();lightboxIndex=null}
function nav(d){if(!media.length)return;lightboxIndex=(lightboxIndex+d+media.length)%media.length;$('#lightbox')?.remove();renderLightbox()}
document.addEventListener('keydown',e=>{if(lightboxIndex===null)return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')nav(-1);if(e.key==='ArrowRight')nav(1)});
shell();
</script>
</body>
</html>

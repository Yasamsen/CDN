<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Media Gallery — Yasamsen/media-repo</title>

<!-- Google Fonts: Fraunces (display serif berkarakter) + Space Grotesk (UI modern) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Font Awesome via cdnjs -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
  :root{
    /* Palet: "Darkroom" — ruang gelap galeri fotografi */
    --ink:        #14110f;   /* latar utama, hampir hitam hangat */
    --ink-2:      #1c1814;   /* panel/sidebar */
    --ink-3:      #241f1a;   /* kartu */
    --line:       #34291f;   /* garis pembatas */
    --cream:      #f4ead5;   /* teks utama */
    --cream-dim:  #b8a98a;   /* teks sekunder */
    --muted:      #7a6e5a;   /* teks lemah */
    --accent:     #e8a33d;   /* amber — ciri khas */
    --accent-2:   #d97757;   /* terracotta sekunder */
    --ok:         #8fb069;
    --err:        #d96b6b;
    --radius: 14px;
    --radius-sm: 8px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Space Grotesk', system-ui, sans-serif;
    background:var(--ink);
    color:var(--cream);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{ background:var(--accent); color:var(--ink); }

  /* ---------- Header ---------- */
  header.app{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:1rem;
    padding:.85rem 1.6rem;
    background:rgba(20,17,15,.82);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:800; font-size:1.35rem;
    letter-spacing:-.02em;
    display:flex; align-items:center; gap:.6rem;
  }
  .brand .mark{
    width:30px; height:30px; border-radius:8px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid; place-items:center; color:var(--ink);
    font-size:.85rem;
  }
  .brand small{
    font-family:'Space Grotesk',sans-serif; font-weight:500;
    font-size:.72rem; color:var(--muted); letter-spacing:.04em;
    text-transform:uppercase; display:block; margin-top:-2px;
  }
  .repo-tag{
    margin-left:auto;
    font-size:.78rem; color:var(--cream-dim);
    background:var(--ink-2); border:1px solid var(--line);
    padding:.35rem .7rem; border-radius:999px;
    display:flex; align-items:center; gap:.45rem;
  }
  .repo-tag i{ color:var(--accent); }

  /* ---------- Layout ---------- */
  .layout{
    display:grid;
    grid-template-columns:260px 1fr;
    min-height:calc(100vh - 61px);
  }

  /* ---------- Sidebar ---------- */
  aside.folders{
    background:var(--ink-2);
    border-right:1px solid var(--line);
    padding:1.2rem .8rem;
    overflow-y:auto;
    max-height:calc(100vh - 61px);
    position:sticky; top:61px;
  }
  .side-title{
    font-family:'Fraunces',serif; font-weight:600;
    font-size:.78rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); padding:0 .5rem .8rem;
  }
  .folder-list{ display:flex; flex-direction:column; gap:.25rem; }
  .folder-btn{
    all:unset; cursor:pointer;
    display:flex; align-items:center; gap:.7rem;
    padding:.7rem .8rem; border-radius:var(--radius-sm);
    color:var(--cream-dim);
    font-size:.92rem; font-weight:500;
    transition:background .18s ease, color .18s ease, transform .18s ease;
    border:1px solid transparent;
  }
  .folder-btn i{ width:18px; text-align:center; color:var(--muted); transition:color .18s; }
  .folder-btn:hover{ background:var(--ink-3); color:var(--cream); }
  .folder-btn:hover i{ color:var(--accent); }
  .folder-btn.active{
    background:linear-gradient(90deg, rgba(232,163,61,.14), transparent);
    color:var(--cream); border-color:rgba(232,163,61,.25);
  }
  .folder-btn.active i{ color:var(--accent); }
  .folder-btn .count{
    margin-left:auto; font-size:.72rem;
    background:var(--ink); color:var(--cream-dim);
    padding:.1rem .45rem; border-radius:999px;
    border:1px solid var(--line);
  }
  .folder-btn.active .count{ color:var(--accent); border-color:rgba(232,163,61,.3); }
  .folder-btn.loading-skel{ pointer-events:none; }

  /* ---------- Main ---------- */
  main.gallery{ padding:1.6rem; min-width:0; }
  .gallery-head{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:1rem; flex-wrap:wrap; margin-bottom:1.3rem;
  }
  .gallery-head h2{
    font-family:'Fraunces',serif; font-weight:600;
    font-size:2rem; letter-spacing:-.02em; line-height:1.1;
  }
  .gallery-head .meta{
    color:var(--cream-dim); font-size:.9rem; margin-top:.3rem;
    display:flex; align-items:center; gap:.5rem;
  }
  .gallery-head .meta .dot{ width:5px;height:5px;border-radius:50%;background:var(--accent); }
  .layout-toggle{ display:none; }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:1rem;
  }
  .card{
    position:relative; border-radius:var(--radius);
    background:var(--ink-3); border:1px solid var(--line);
    overflow:hidden; cursor:pointer;
    transition:transform .22s ease, border-color .22s ease, box-shadow .22s ease;
    aspect-ratio: 1 / 1;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:rgba(232,163,61,.4);
    box-shadow:0 14px 30px -18px rgba(0,0,0,.7), 0 0 0 1px rgba(232,163,61,.08);
  }
  .card .thumb{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; background:var(--ink);
    transition:transform .4s ease;
  }
  .card:hover .thumb{ transform:scale(1.04); }
  .card .play-badge{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:48px; height:48px; border-radius:50%;
    background:rgba(20,17,15,.6); backdrop-filter:blur(4px);
    border:1.5px solid rgba(244,234,213,.7);
    display:grid; place-items:center;
    color:var(--cream); font-size:1rem;
    pointer-events:none;
  }
  .card .play-badge::before{
    content:''; position:absolute; left:55%; top:50%;
    transform:translate(-50%,-50%);
    border-style:solid; border-width:8px 0 8px 13px;
    border-color:transparent transparent transparent var(--cream);
    margin-left:3px;
  }
  .card .overlay{
    position:absolute; left:0; right:0; bottom:0;
    padding:.7rem .8rem;
    background:linear-gradient(to top, rgba(20,17,15,.92), transparent);
    display:flex; align-items:center; gap:.5rem;
    opacity:0; transform:translateY(6px);
    transition:opacity .22s, transform .22s;
  }
  .card:hover .overlay{ opacity:1; transform:translateY(0); }
  .card .fname{
    font-size:.74rem; color:var(--cream-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    flex:1;
  }
  .card .dl-btn{
    all:unset; cursor:pointer;
    width:30px; height:30px; border-radius:8px;
    display:grid; place-items:center;
    background:rgba(232,163,61,.16); color:var(--accent);
    border:1px solid rgba(232,163,61,.3);
    transition:background .18s, color .18s;
    flex-shrink:0;
  }
  .card .dl-btn:hover{ background:var(--accent); color:var(--ink); }
  .card .dl-btn.spin i{ animation:rot .8s linear infinite; }
  @keyframes rot{ to{ transform:rotate(360deg); } }

  /* ---------- Skeleton shimmer ---------- */
  .skel{
    position:relative; overflow:hidden;
    background:var(--ink-3); border:1px solid var(--line);
    border-radius:var(--radius);
    aspect-ratio:1/1;
  }
  .skel::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(244,234,213,.06), transparent);
    transform:translateX(-100%);
    animation:shimmer 1.4s infinite;
  }
  @keyframes shimmer{ 100%{ transform:translateX(100%); } }
  .skel-line{
    height:10px; border-radius:6px; background:var(--ink-3);
    position:relative; overflow:hidden;
  }
  .skel-line::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(244,234,213,.06), transparent);
    transform:translateX(-100%); animation:shimmer 1.4s infinite;
  }

  /* ---------- Empty / Error ---------- */
  .notice{
    grid-column:1/-1;
    text-align:center; padding:3.5rem 1rem;
    border:1px dashed var(--line); border-radius:var(--radius);
    background:var(--ink-2);
  }
  .notice i{ font-size:2rem; color:var(--accent); margin-bottom:.8rem; display:block; }
  .notice.err i{ color:var(--err); }
  .notice h3{ font-family:'Fraunces',serif; font-weight:600; font-size:1.3rem; margin-bottom:.4rem; }
  .notice p{ color:var(--cream-dim); font-size:.9rem; max-width:42ch; margin:0 auto; }

  /* ---------- Lightbox ---------- */
  .lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(10,8,7,.96);
    display:none; align-items:center; justify-content:center;
    opacity:0; transition:opacity .25s ease;
  }
  .lightbox.open{ display:flex; opacity:1; }
  .lb-media{
    max-width:90vw; max-height:84vh;
    border-radius:var(--radius);
    box-shadow:0 30px 80px -30px rgba(0,0,0,.9);
    animation:pop .25s ease;
  }
  @keyframes pop{ from{ transform:scale(.96); opacity:.4; } to{ transform:scale(1); opacity:1; } }
  .lb-media img{ width:auto; height:auto; max-width:90vw; max-height:84vh; object-fit:contain; }
  .lb-close{
    position:absolute; top:1.2rem; right:1.2rem;
    width:44px; height:44px; border-radius:50%;
    background:rgba(244,234,213,.08); border:1px solid rgba(244,234,213,.2);
    color:var(--cream); cursor:pointer; font-size:1.1rem;
    display:grid; place-items:center; transition:background .18s, transform .18s;
  }
  .lb-close:hover{ background:var(--err); transform:rotate(90deg); }
  .lb-nav{
    position:absolute; top:50%; transform:translateY(-50%);
    width:52px; height:52px; border-radius:50%;
    background:rgba(244,234,213,.07); border:1px solid rgba(244,234,213,.2);
    color:var(--cream); cursor:pointer; font-size:1.1rem;
    display:grid; place-items:center; transition:background .18s, color .18s;
  }
  .lb-nav:hover{ background:var(--accent); color:var(--ink); }
  .lb-nav.prev{ left:1.2rem; }
  .lb-nav.next{ right:1.2rem; }
  .lb-counter{
    position:absolute; bottom:1.4rem; left:50%; transform:translateX(-50%);
    font-size:.82rem; color:var(--cream-dim);
    background:rgba(20,17,15,.6); padding:.3rem .9rem; border-radius:999px;
    border:1px solid var(--line);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- Mobile ---------- */
  @media (max-width:820px){
    .layout{ grid-template-columns:1fr; }
    aside.folders{
      position:sticky; top:61px; max-height:none;
      border-right:none; border-bottom:1px solid var(--line);
      padding:.7rem .8rem;
    }
    .side-title{ display:none; }
    .folder-list{
      flex-direction:row; overflow-x:auto;
      gap:.5rem; padding-bottom:.3rem;
      scrollbar-width:thin;
    }
    .folder-list::-webkit-scrollbar{ height:5px; }
    .folder-list::-webkit-scrollbar-thumb{ background:var(--line); border-radius:9px; }
    .folder-btn{ white-space:nowrap; flex-shrink:0; }
    .folder-btn .count{ margin-left:.4rem; }
    main.gallery{ padding:1.1rem; }
    .gallery-head h2{ font-size:1.6rem; }
    .lb-nav{ width:42px; height:42px; }
    .lb-nav.prev{ left:.6rem; }
    .lb-nav.next{ right:.6rem; }
  }
</style>
</head>
<body>

<header class="app">
  <div class="brand">
    <span class="mark"><i class="fa-solid fa-aperture"></i></span>
    <span>
      Media Gallery
      <small>Yasamsen / media-repo</small>
    </span>
  </div>
  <div class="repo-tag"><i class="fa-brands fa-github"></i> main</div>
</header>

<div class="layout">
  <aside class="folders">
    <div class="side-title">Folders</div>
    <div class="folder-list" id="folderList">
      <!-- skeleton sidebar -->
      <div class="skel-line" style="width:80%; height:34px; margin:.3rem .5rem .4rem;"></div>
      <div class="skel-line" style="width:65%; height:34px; margin:.3rem .5rem .4rem;"></div>
      <div class="skel-line" style="width:72%; height:34px; margin:.3rem .5rem .4rem;"></div>
    </div>
  </aside>

  <main class="gallery">
    <div class="gallery-head">
      <div>
        <h2 id="galleryTitle">Memuat…</h2>
        <div class="meta" id="galleryMeta"><span class="dot"></span> mengambil daftar folder</div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>
  <button class="lb-nav prev" id="lbPrev" aria-label="Sebelumnya"><i class="fa-solid fa-chevron-left"></i></button>
  <div id="lbMediaWrap"></div>
  <button class="lb-nav next" id="lbNext" aria-label="Berikutnya"><i class="fa-solid fa-chevron-right"></i></button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<script>
(() => {
  const USER = 'Yasamsen';
  const REPO = 'media-repo';
  const BRANCH = 'main';
  const API_ROOT = `https://api.github.com/repos/${USER}/${REPO}/contents/`;
  const RAW_ROOT = `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/`;

  const IMG_EXT = ['jpg','jpeg','png','webp','gif'];

  const $ = (id) => document.getElementById(id);
  const folderList = $('folderList');
  const grid = $('grid');
  const titleEl = $('galleryTitle');
  const metaEl = $('galleryMeta');

  let folders = [];        // [{name}]
  let currentItems = [];   // [{url, type, name}]
  let currentFolder = null;
  let lbIndex = -1;

  const extOf = (url) => {
    const clean = url.split('?')[0].split('#')[0];
    return clean.split('.').pop().toLowerCase();
  };
  const isImage = (url) => IMG_EXT.includes(extOf(url));
  const fileNameOf = (url) => decodeURIComponent(url.split('/').pop().split('?')[0]);

  /* ---------- Fetch folder list ---------- */
  async function loadFolders() {
    try {
      const res = await fetch(API_ROOT, { headers: { 'Accept':'application/vnd.github+json' }});
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      folders = data.filter(it => it.type === 'dir');
      if (!folders.length) {
        folderList.innerHTML = '';
        renderEmpty('Tidak ada folder', 'Repo ini tidak memiliki folder di root.', false);
        return;
      }
      renderFolderButtons();
      // load first folder automatically
      selectFolder(folders[0].name);
    } catch (e) {
      folderList.innerHTML = '';
      renderEmpty('Gagal memuat daftar folder', e.message + ' — periksa koneksi atau apakah repo publik.', true);
      metaEl.textContent = 'gagal memuat';
    }
  }

  function renderFolderButtons() {
    folderList.innerHTML = '';
    folders.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'folder-btn';
      btn.dataset.name = f.name;
      btn.innerHTML = `<i class="fa-regular fa-folder"></i>
        <span>${f.name}</span>
        <span class="count" data-count>—</span>`;
      btn.addEventListener('click', () => selectFolder(f.name));
      folderList.appendChild(btn);
    });
  }

  function setActiveFolderBtn(name) {
    folderList.querySelectorAll('.folder-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.name === name);
    });
  }

  /* ---------- Select + load folder contents ---------- */
  async function selectFolder(name) {
    currentFolder = name;
    setActiveFolderBtn(name);
    titleEl.textContent = name;
    metaEl.innerHTML = `<span class="dot"></span> memuat isi folder…`;
    renderSkeletons(8);

    try {
      const res = await fetch(RAW_ROOT + encodeURIComponent(name) + '/api.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      const links = (json && Array.isArray(json.data)) ? json.data : [];
      if (!links.length) {
        renderEmpty('Folder kosong', `Tidak ada item di folder “${name}”.`, false);
        updateFolderCount(name, 0);
        return;
      }
      currentItems = links.map(url => ({
        url,
        name: fileNameOf(url),
        type: isImage(url) ? 'image' : 'video'
      }));
      updateFolderCount(name, currentItems.length);
      renderGrid(currentItems);
      metaEl.innerHTML = `<span class="dot"></span> ${currentItems.length} item`;
    } catch (e) {
      currentItems = [];
      renderEmpty('Gagal memuat folder', `Tidak bisa mengambil api.json untuk “${name}” — ${e.message}`, true);
      updateFolderCount(name, 0);
    }
  }

  function updateFolderCount(name, n) {
    const btn = folderList.querySelector(`.folder-btn[data-name="${CSS.escape(name)}"]`);
    if (btn) btn.querySelector('[data-count]').textContent = n;
  }

  /* ---------- Renderers ---------- */
  function renderSkeletons(n) {
    grid.innerHTML = '';
    for (let i=0;i<n;i++){
      const s = document.createElement('div');
      s.className = 'skel';
      grid.appendChild(s);
    }
  }

  function renderEmpty(title, msg, isErr) {
    grid.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'notice' + (isErr ? ' err' : '');
    d.innerHTML = `<i class="fa-solid ${isErr ? 'fa-triangle-exclamation' : 'fa-folder-open'}"></i>
      <h3>${title}</h3><p>${msg}</p>`;
    grid.appendChild(d);
  }

  function renderGrid(items) {
    grid.innerHTML = '';
    items.forEach((it, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.idx = idx;

      if (it.type === 'image') {
        const img = document.createElement('img');
        img.className = 'thumb';
        img.loading = 'lazy';
        img.alt = it.name;
        img.src = it.url;
        card.appendChild(img);
      } else {
        const vid = document.createElement('video');
        vid.className = 'thumb';
        vid.preload = 'metadata';
        vid.muted = true;
        vid.playsInline = true;
        vid.src = it.url;
        // pakai frame pertama sebagai thumbnail
        const badge = document.createElement('div');
        badge.className = 'play-badge';
        card.appendChild(vid);
        card.appendChild(badge);
      }

      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.innerHTML = `<span class="fname">${it.name}</span>`;
      const dl = document.createElement('button');
      dl.className = 'dl-btn';
      dl.title = 'Download';
      dl.innerHTML = '<i class="fa-solid fa-download"></i>';
      dl.addEventListener('click', (e) => { e.stopPropagation(); downloadItem(it, dl); });
      overlay.appendChild(dl);
      card.appendChild(overlay);

      card.addEventListener('click', () => openLightbox(idx));
      grid.appendChild(card);
    });
  }

  /* ---------- Download (blob) ---------- */
  async function downloadItem(it, btn) {
    try {
      btn.classList.add('spin');
      const res = await fetch(it.url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = it.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    } catch (e) {
      alert('Gagal mengunduh: ' + e.message);
    } finally {
      btn.classList.remove('spin');
    }
  }

  /* ---------- Lightbox ---------- */
  const lightbox = $('lightbox');
  const lbMediaWrap = $('lbMediaWrap');
  const lbCounter = $('lbCounter');

  function openLightbox(idx) {
    lbIndex = idx;
    renderLightboxMedia();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
    lbMediaWrap.innerHTML = '';
    document.body.style.overflow = '';
    lbIndex = -1;
  }
  function renderLightboxMedia() {
    if (lbIndex < 0 || !currentItems.length) return;
    const it = currentItems[lbIndex];
    lbMediaWrap.innerHTML = '';
    if (it.type === 'image') {
      const img = document.createElement('img');
      img.className = 'lb-media';
      img.src = it.url;
      img.alt = it.name;
      lbMediaWrap.appendChild(img);
    } else {
      const vid = document.createElement('video');
      vid.className = 'lb-media';
      vid.controls = true;
      vid.preload = 'metadata';
      vid.src = it.url;
      lbMediaWrap.appendChild(vid);
    }
    lbCounter.textContent = `${lbIndex+1} / ${currentItems.length}`;
  }
  function lbStep(d) {
    if (!currentItems.length) return;
    lbIndex = (lbIndex + d + currentItems.length) % currentItems.length;
    renderLightboxMedia();
  }

  $('lbClose').addEventListener('click', closeLightbox);
  $('lbPrev').addEventListener('click', () => lbStep(-1));
  $('lbNext').addEventListener('click', () => lbStep(1));
  // klik di luar media (pada backdrop) menutup
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') lbStep(-1);
    else if (e.key === 'ArrowRight') lbStep(1);
  });

  /* ---------- Boot ---------- */
  loadFolders();
})();
</script>
</body>
</html>
